name: Dispatch Homebrew

on:
  workflow_call:
    inputs:
      project:
        description: The project to publish
        type: string
        required: true
      project-desc:
        description: A short description of the project
        type: string
        required: true
      version-tag:
        description: The git tag of the version to publish
        type: string
        required: true
      repository:
        description: The repository to dispatch to
        type: string
        required: false
        default: siafoundation/homebrew-sia

jobs:
  dispatch:
    runs-on: tenki-standard-small-2c-4g
    steps:
      - name: Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PAT_REPOSITORY_DISPATCH }}
          repository: ${{ inputs.repository }}
          event-type: release-tagged
          client-payload: >
            {
              "description": "${{ inputs.project-desc }}",
              "tag": "${{ inputs.version-tag }}",
              "project": "${{ inputs.project }}",
              "workflow_id": "${{ github.run_id }}"
            }
