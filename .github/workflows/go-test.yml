name: Lint & Test Go

on:
  workflow_call:
    inputs:
      go-test-args:
        description: "Arguments to pass to `go test`"
        type: string
        required: false
      try-build:
        description: "Attempt to build the project"
        type: boolean
        required: false
        default: true

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26, 1.27]
        os: [tenki-standard-medium-4c-8g, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git # required for golangci-lint on Windows
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - uses: SiaFoundation/workflows/.github/actions/go-test@e8b6c35147ded02a1609915352ae8562d1a70aef # master
        with:
          go-test-args: ${{ inputs.go-test-args }}
      - name: Build
        if: ${{ inputs.try-build }}
        shell: bash
        run: |
          go mod download
          go build -o bin/ ./...

  success: # Use in branch rulesets to ensure all matrix jobs completed successfully
    needs: test
    runs-on: tenki-standard-small-2c-4g
    steps:
      - run: echo "Success!"
