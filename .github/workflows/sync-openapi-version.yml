name: Sync OpenAPI spec Version with latest release

on:
  workflow_call:
    inputs:
      spec_path:
        description: OpenAPI spec file path.
        required: false
        type: string
      spec_paths:
        description: Newline-separated list of OpenAPI spec file paths or globs.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Sync OpenAPI versions
        id: sync
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          SPEC_PATHS: ${{ inputs.spec_paths }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');

            function resolveFiles(entries) {
              const seen = new Set();
              const files = [];
              for (const e of entries) {
                if (!e) continue;
                const out = execFileSync('git', ['ls-files', '--', e], { encoding: 'utf8' });
                for (const line of out.split('\n')) {
                  const f = line.trim();
                  if (!f) continue;
                  if (!seen.has(f)) { seen.add(f); files.push(f); }
                }
              }
              return files;
            }

            // Replace info.version in place, rewriting only that one line.
            // yq -i reserializes the whole document, which collapses hand
            // wrapped block scalars and strips blank lines — a one line bump
            // becomes a whole file reformat.
            function setInfoVersion(text, version) {
              const lines = text.split('\n');
              const infoIdx = lines.findIndex((l) => /^info:\s*(#.*)?$/.test(l));
              if (infoIdx === -1) return null;
              // Track the indent of info's own keys so a `version:` nested
              // deeper (inside a description, say) is never matched.
              let indent = null;
              for (let i = infoIdx + 1; i < lines.length; i++) {
                const line = lines[i];
                if (!line.trim()) continue;
                const m = line.match(/^(\s+)\S/);
                if (!m) break;
                if (indent === null) indent = m[1];
                if (m[1] !== indent) continue;
                if (new RegExp(`^${indent}version:\\s*(.*)$`).test(line)) {
                  lines[i] = `${indent}version: ${version}`;
                  return lines.join('\n');
                }
              }
              return null;
            }

            // 1) Get latest release
            let tag = '';
            let latest = '';
            try {
              const { data } = await github.rest.repos.getLatestRelease({ owner: context.repo.owner, repo: context.repo.repo });
              tag = data.tag_name || '';
              latest = tag.replace(/^v/, '');
            } catch (e) {
              core.info('No latest release found. Skipping.');
              core.setOutput('changed', 'false');
              core.setOutput('version', '');
              core.setOutput('tag', '');
              core.setOutput('files', '');
              return;
            }
            if (!latest) {
              core.info('Latest release has no tag_name. Skipping.');
              core.setOutput('changed', 'false');
              core.setOutput('version', '');
              core.setOutput('tag', '');
              core.setOutput('files', '');
              return;
            }

            // 2) Resolve spec files
            // Read from env, not core.getInput: these arrive as workflow_call
            // inputs on the job, so they are never exposed to this step as
            // INPUT_* variables.
            const specPaths = (process.env.SPEC_PATHS || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            const specPathFallback = (process.env.SPEC_PATH || '').trim();
            const entries = specPaths.length > 0 ? specPaths : (specPathFallback ? [specPathFallback] : []);
            const files = resolveFiles(entries);
            if (files.length === 0) {
              core.info('No spec files resolved.');
              core.setOutput('changed', 'false');
              core.setOutput('version', latest);
              core.setOutput('tag', tag);
              core.setOutput('files', '');
              return;
            }

            // 3) Compare and update using yq
            const changed = [];
            for (const path of files) {
              try {
                const currentRaw = execFileSync('yq', ['-r', '.info.version // ""', path], { encoding: 'utf8' }).trim();
                const current = (currentRaw || '').replace(/^v/, '');
                if (current !== latest) {
                  const updated = setInfoVersion(fs.readFileSync(path, 'utf8'), latest);
                  if (updated === null) {
                    core.warning(`Could not locate info.version in ${path}; skipping.`);
                    continue;
                  }
                  fs.writeFileSync(path, updated);
                  // Confirm the file still parses and now reports the new version.
                  const after = execFileSync('yq', ['-r', '.info.version // ""', path], { encoding: 'utf8' }).trim();
                  if (after.replace(/^v/, '') !== latest) {
                    core.warning(`Verification failed for ${path}: reads ${after} after update; skipping.`);
                    continue;
                  }
                  changed.push(path);
                  core.info(`Updated ${path}: ${current || '<empty>'} -> ${latest}`);
                } else {
                  core.info(`Up-to-date: ${path} (${current})`);
                }
              } catch (e) {
                core.warning(`Failed processing ${path}: ${e.message}`);
              }
            }

            core.setOutput('changed', changed.length > 0 ? 'true' : 'false');
            core.setOutput('version', latest);
            core.setOutput('tag', tag);
            core.setOutput('files', changed.join('\n'));

      - name: Create Pull Request
        if: ${{ steps.sync.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-openapi-version-to-${{ steps.sync.outputs.version }}
          commit-message: "chore(openapi): sync info.version to ${{ steps.sync.outputs.version }}"
          title: "chore(openapi): sync OpenAPI info.version to ${{ steps.sync.outputs.version }}"
          body: |
            This PR updates OpenAPI spec versions to match the latest release tag `${{ steps.sync.outputs.tag }}`.

            Latest version: `${{ steps.sync.outputs.version }}`
          labels: |
            chore
            openapi
          add-paths: |
            ${{ steps.sync.outputs.files }}
